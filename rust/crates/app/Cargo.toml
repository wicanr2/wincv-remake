[package]
name = "wincv-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 把各個模式接起來(對應 Go 版 internal/app)。不依賴視窗系統,整個互動流程可以
# headless 測,celldump -app -keys 也走同一條路徑。

[dependencies]
wincv-archive.workspace = true
wincv-browser.workspace = true
wincv-cell.workspace = true
wincv-checksum.workspace = true
wincv-convert.workspace = true
wincv-dict.workspace = true
wincv-editor.workspace = true
wincv-epub.workspace = true
wincv-eten.workspace = true
wincv-fileop.workspace = true
wincv-gopher.workspace = true
wincv-hexview.workspace = true
wincv-i18n.workspace = true
wincv-imgfmt.workspace = true
wincv-imgview.workspace = true
wincv-keys.workspace = true
wincv-launch.workspace = true
wincv-markdown.workspace = true
wincv-note.workspace = true
wincv-render.workspace = true
wincv-search.workspace = true
wincv-session.workspace = true
wincv-syntax.workspace = true
wincv-textenc.workspace = true
wincv-thumbs.workspace = true
wincv-vfs.workspace = true
wincv-viewer.workspace = true
wincv-web.workspace = true

[dev-dependencies]
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
