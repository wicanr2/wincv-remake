[package]
name = "wincv-officedoc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 把 Word、PowerPoint、Excel 收在同一個介面後面(對應 Go 版 internal/officedoc)。

[dependencies]
wincv-doc97 = { path = "../doc97" }
wincv-docx = { path = "../docx" }
wincv-pptx = { path = "../pptx" }
wincv-rtf = { path = "../rtf" }
wincv-xlsx = { path = "../xlsx" }
wincv-i18n.workspace = true
wincv-markdown.workspace = true
wincv-textenc.workspace = true

[dev-dependencies]
# examples/docsum.rs:內嵌圖片解碼後算像素的 sha256,與 Go 版 tools/docsum-office 對照。
wincv-imgfmt.workspace = true
wincv-ooxml = { path = "../ooxml" }
sha2.workspace = true
