[package]
name = "wincv-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 與 Go 版對照用的工具。輸出格式與 Go 端的 tools/archsum 相同,兩邊直接 diff。

[[bin]]
name = "archsum"
path = "src/bin/archsum.rs"

[[bin]]
name = "pdfshot"
path = "src/bin/pdfshot.rs"

[dependencies]
wincv-lzh.workspace = true
sha2.workspace = true
rars = { version = "0.12", default-features = false }
hayro = { version = "0.9", features = ["embed-fonts"] }
png.workspace = true
