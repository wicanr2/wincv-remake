[package]
name = "wincv-oracle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 與 Go 版對照用的工具。輸出格式與 Go 端的 tools/archsum 相同,兩邊直接 diff。

[[bin]]
name = "archsum"
path = "src/bin/archsum.rs"

[[bin]]
name = "textencsum"
path = "src/bin/textencsum.rs"

[[bin]]
name = "imgsum"
path = "src/bin/imgsum.rs"

[[bin]]
name = "pdfshot"
path = "src/bin/pdfshot.rs"

[dependencies]
wincv-archive.workspace = true
wincv-imgfmt.workspace = true
wincv-vfs.workspace = true
wincv-textenc.workspace = true
sha2.workspace = true
hayro = { version = "0.9", features = ["embed-fonts"] }
png.workspace = true
