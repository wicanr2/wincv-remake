[package]
name = "wincv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# fonts:建置時把原版半形字型與倚天 15 點字庫內嵌進執行檔(對應 Go 版的
# -tags fonts 完整版)。字型來源目錄由環境變數 WINCV_FONT_DIR 指定,
# 底下要有 app/cvga.fon 與 eten/STDFONT.15、SPCFONT.15、SPCFSUPP.15。
# 內嵌了第三方字型的產物只能留在本機,不能散布(見 NOTICE)。
[features]
fonts = []

[dependencies]
wincv-cell.workspace = true
wincv-fnt.workspace = true
wincv-eten.workspace = true
wincv-render.workspace = true
winit = "0.30"
softbuffer = "0.4"
