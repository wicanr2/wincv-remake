[package]
name = "wincv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# fonts:把 internal/bundled/assets/ 底下的字型嵌進執行檔(對應 Go 版的 -tags fonts
# 完整版)。素材由 tools/embed-fonts.sh full 準備;內嵌了第三方字型的產物只能留在本機,
# 不能散布(見 NOTICE)。
[features]
fonts = ["wincv-bundled/fonts"]

[dependencies]
wincv-app.workspace = true
wincv-appicon.workspace = true
wincv-bundled.workspace = true
wincv-cell.workspace = true
wincv-datadir.workspace = true
wincv-eten.workspace = true
wincv-fontset.workspace = true
wincv-i18n.workspace = true
wincv-keys.workspace = true
wincv-render.workspace = true
wincv-session.workspace = true
wincv-thumbs.workspace = true
wincv-ttf.workspace = true
wincv-vfs.workspace = true
winit = "0.30"
softbuffer = "0.4"
