[package]
name = "wincv-archive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# 壓縮檔當目錄瀏覽(對應 Go 版 internal/archive)。全部純 Rust,不用 C 函式庫。

[dependencies]
wincv-vfs.workspace = true
wincv-lzh.workspace = true
wincv-i18n.workspace = true
wincv-textenc.workspace = true
chrono.workspace = true
zip = { version = "9.5", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "legacy-zip"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate", "brotli", "lz4"] }
rars = { version = "0.12", default-features = false }
crc32fast = "1"

[dev-dependencies]
sha2.workspace = true
