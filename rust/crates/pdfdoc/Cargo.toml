[package]
name = "wincv-pdfdoc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# PDF 取文字與圖片、書籤、頁面大小、畫整頁(對應 Go 版 internal/pdfdoc)。
# Go 版底下是自寫的 internal/pdf(物件層用 pdfcpu);這裡不搬那一層,
# 解析、內容串流直譯與光柵化都交給 hayro(版本與 wincv-oracle 的 pdfshot 相同)。

[dependencies]
wincv-render.workspace = true
wincv-i18n.workspace = true
png.workspace = true
hayro = { version = "0.9", features = ["embed-fonts"] }

[dev-dependencies]
wincv-imgfmt.workspace = true
sha2.workspace = true
