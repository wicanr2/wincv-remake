[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
publish = false

[workspace.dependencies]
wincv-cell = { path = "crates/cell" }
wincv-fnt = { path = "crates/fnt" }
wincv-eten = { path = "crates/eten" }
wincv-render = { path = "crates/render" }
wincv-lzh = { path = "crates/lzh" }
wincv-i18n = { path = "crates/i18n" }
wincv-keys = { path = "crates/keys" }
wincv-textenc = { path = "crates/textenc" }
wincv-vfs = { path = "crates/vfs" }
wincv-browser = { path = "crates/browser" }
wincv-viewer = { path = "crates/viewer" }
wincv-hexview = { path = "crates/hexview" }
wincv-session = { path = "crates/session" }
wincv-oracle = { path = "crates/oracle" }
encoding_rs = "0.8"
png = "0.17"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

# 發行版:量產物大小與效能用的設定(docs/plan/rust-rewrite.md 第一階段)。
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
